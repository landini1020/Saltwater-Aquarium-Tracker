<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reef Log — sync engine tests</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 24px; max-width: 900px; }
  h1 { font-size: 19px; }
  #out { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .ok { color: #1c8a5a; } .fail { color: #c33c3c; font-weight: bold; }
  .head { margin-top: 14px; font-weight: bold; }
</style>
</head>
<body>
<h1>Sync engine tests</h1>
<p>Runs the real sync module against an in-page fake of the Supabase REST endpoints,
covering push, pull, last-write-wins and deletion propagation. Open the console for detail.</p>
<div id="out">running…</div>

<script type="module">
import * as db from './js/db.js';
import * as store from './js/store.js';
import * as sync from './js/sync.js';

const out = document.getElementById('out');
let passed = 0, failed = 0;

function log(msg, cls = '') {
  out.insertAdjacentHTML('beforeend', `\n<span class="${cls}">${msg}</span>`);
}
function check(label, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  if (ok) { passed++; log(`  PASS  ${label}`, 'ok'); }
  else { failed++; log(`  FAIL  ${label}\n        expected ${JSON.stringify(expected)}\n        actual   ${JSON.stringify(actual)}`, 'fail'); }
}

/* --- Fake Supabase -------------------------------------------------------- */

const server = { rows: new Map(), pushes: 0, pulls: 0 };
const realFetch = window.fetch;

window.fetch = async (url, init = {}) => {
  const u = String(url);

  if (u.includes('/auth/v1/verify') || u.includes('grant_type=refresh_token')) {
    return json({ access_token: 'test-token', refresh_token: 'test-refresh', expires_in: 3600,
                  user: { email: 'test@example.com' } });
  }
  if (u.includes('/auth/v1/otp') || u.includes('/auth/v1/logout')) return json({});

  if (u.includes('/rest/v1/reef_records')) {
    if ((init.method || 'GET') === 'POST') {
      server.pushes++;
      for (const r of JSON.parse(init.body)) {
        server.rows.set(`${r.collection}|${r.record_id}`, r);
      }
      return new Response(null, { status: 204 });   // 204 must not carry a body
    }
    server.pulls++;
    const m = u.match(/updated_at=gt\.([^&]+)/);
    const since = m ? decodeURIComponent(m[1]) : null;
    const rows = [...server.rows.values()]
      .filter((r) => !since || r.updated_at > since)
      .sort((a, b) => String(a.updated_at).localeCompare(String(b.updated_at)));
    return json(rows);
  }
  return realFetch(url, init);
};

const json = (body) => new Response(JSON.stringify(body), {
  status: 200, headers: { 'Content-Type': 'application/json' },
});

/* --- Helpers -------------------------------------------------------------- */

const wipe = () => new Promise((res) => {
  const q = indexedDB.deleteDatabase('reef-log');
  q.onsuccess = res; q.onerror = res; q.onblocked = res;
});

async function freshDevice() {
  await wipe();
  await store.init();
  await sync.clearConfig().catch(() => {});
  await sync.connect({ url: 'https://test.supabase.co', anonKey: 'x'.repeat(40) });
  await sync.verifyCode('test@example.com', '123456');
}

/* --- Tests ---------------------------------------------------------------- */

(async () => {
  try {
    log('<span class="head">Device A: first sync uploads the whole log</span>');
    await freshDevice();
    const aLivestock = store.livestock().length;
    check('server received records', server.rows.size > 0, true);
    check('livestock uploaded', [...server.rows.keys()].filter((k) => k.startsWith('livestock|')).length, 96);

    log('<span class="head">Device A: a new expense pushes</span>');
    const before = server.rows.size;
    await store.saveExpense({ date: '2026-08-16', description: 'Sync test salt', category: 'Salt & RO/DI', store: 'Test', amount: 42 });
    await sync.syncNow();
    check('one more record on the server', server.rows.size, before + 1);

    log('<span class="head">Device B: a fresh device pulls everything down</span>');
    await freshDevice();          // wipes local data, re-seeds, then syncs
    const pulled = store.expenses().find((e) => e.description === 'Sync test salt');
    check('livestock arrived', store.livestock().length, aLivestock);
    check('the new expense arrived', Boolean(pulled), true);

    log('<span class="head">Deleting on B removes it on A</span>');
    await store.deleteExpense(pulled.id);
    await sync.syncNow();
    const tomb = server.rows.get(`expenses|${pulled.id}`);
    check('server holds a tombstone', Boolean(tomb && tomb.data.deleted), true);

    await freshDevice();
    check('deleted expense does not come back', store.expenses().some((e) => e.id === pulled.id), false);
    check('tombstone is hidden from the UI list', store.expenses().some((e) => e.description === 'Sync test salt'), false);

    log('<span class="head">Last write wins on a conflicting edit</span>');
    const tank = store.activeTank();
    // Simulate the other device having renamed the tank one hour from now.
    const future = new Date(Date.now() + 3600e3).toISOString();
    server.rows.set(`tanks|${tank.id}`, {
      collection: 'tanks', record_id: tank.id, updated_at: future,
      data: { ...tank, name: 'Renamed Remotely', updatedAt: future },
    });
    await store.saveTank({ ...tank, name: 'Renamed Locally' });
    await sync.syncNow({ full: true });
    check('the newer remote edit wins', store.activeTank().name, 'Renamed Remotely');

    // ...and the reverse. The remote copy is now stamped an hour ago, so the
    // local edit that follows is genuinely the later of the two and must stand.
    const past = new Date(Date.now() - 3600e3).toISOString();
    server.rows.set(`tanks|${tank.id}`, {
      collection: 'tanks', record_id: tank.id, updated_at: past,
      data: { ...tank, name: 'Stale Remote Name', updatedAt: past },
    });
    await store.saveTank({ ...store.activeTank(), name: 'Renamed Later Locally' });
    await sync.syncNow({ full: true });
    check('a later local edit survives the pull', store.activeTank().name, 'Renamed Later Locally');
    check('and is pushed back to the server',
          server.rows.get(`tanks|${tank.id}`).data.name, 'Renamed Later Locally');

    log('<span class="head">Offline is survivable</span>');
    window.fetch = () => Promise.reject(new TypeError('Failed to fetch'));
    const result = await sync.syncNow();
    check('reports an error rather than throwing', Boolean(result.error), true);
    check('status shows offline or error', ['offline', 'error'].includes(sync.getStatus().state), true);
    await store.saveExpense({ date: '2026-08-16', description: 'Written while offline', category: 'Other', amount: 5 });
    check('still writes locally while offline', store.expenses().some((e) => e.description === 'Written while offline'), true);

    log(`\n<span class="head">${failed ? 'FAILED' : 'All good'} — ${passed} passed, ${failed} failed</span>`,
        failed ? 'fail' : 'ok');
  } catch (err) {
    failed++;
    log(`\n  ERROR  ${err && err.stack ? err.stack : err}`, 'fail');
  } finally {
    window.__testsDone = true;
    window.__testResult = { passed, failed };
  }
})();
</script>
</body>
</html>
