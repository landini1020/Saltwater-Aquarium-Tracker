<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Log and chart water parameters, livestock and expenses for a saltwater aquarium.">
<meta name="theme-color" content="#0b2b3f">
<title>Reef Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reef Log">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot__logo" aria-hidden="true"></div>
  <p class="boot__msg">Loading Reef Log&hellip;</p>
  <noscript><p class="boot__err">Reef Log needs JavaScript enabled.</p></noscript>
</div>

<div id="app" class="app" hidden>

  <header class="topbar">
    <button class="topbar__menu" id="navToggle" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="topbar__title">
      <h1 id="tankName">Reef Log</h1>
      <p id="tankMeta" class="topbar__sub"></p>
    </div>
    <a class="syncdot" id="syncDot" href="#/settings" title="Sync" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 01-9 9 9 9 0 01-7.5-4M3 12a9 9 0 019-9 9 9 0 017.5 4"/><path d="M17 7h3V4M7 17H4v3"/></svg>
    </a>
    <button class="btn btn--primary topbar__action" data-action="log-test">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Log Test</span>
    </button>
  </header>

  <nav class="sidenav" id="sidenav" aria-label="Sections">
    <div class="sidenav__brand">
      <span class="sidenav__mark" aria-hidden="true"></span>
      <span>Reef&nbsp;Log</span>
    </div>
    <ul class="sidenav__list">
      <li><a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg><span>Dashboard</span></a></li>
      <li><a href="#/parameters" data-route="parameters"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18M6 19V9M11 19V5M16 19v-7"/></svg><span>Parameters</span></a></li>
      <li><a href="#/maintenance" data-route="maintenance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H5a2 2 0 00-2 2v4M15 3h4a2 2 0 012 2v4M9 21H5a2 2 0 01-2-2v-4M15 21h4a2 2 0 002-2v-4"/><path d="M12 8v4l3 2"/></svg><span>Maintenance</span></a></li>
      <li><a href="#/livestock" data-route="livestock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c4-6 11-6 15 0-4 6-11 6-15 0zM18 12l3-3v6l-3-3z"/></svg><span>Livestock</span></a></li>
      <li><a href="#/gear" data-route="gear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M4 17h6"/><circle cx="17" cy="7" r="3"/><circle cx="13" cy="17" r="3"/></svg><span>Gear</span></a></li>
      <li><a href="#/expenses" data-route="expenses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M16 7H10a3 3 0 000 6h4a3 3 0 010 6H7"/></svg><span>Expenses</span></a></li>
      <li><a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 00-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 00-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 000 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 002 1.2l.4 2.7h4.4l.4-2.7a7 7 0 002-1.2l2.3 1 2-3.4-2-1.5c.06-.4.1-.8.1-1.2z"/></svg><span>Settings</span></a></li>
    </ul>
    <div class="sidenav__foot">
      <label class="tankpick">
        <span>Tank</span>
        <select id="tankSelect"></select>
      </label>
    </div>
  </nav>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="view" tabindex="-1"></main>

  <!-- Five slots for seven sections: the two most-used plus a drawer opener. -->
  <nav class="tabbar" aria-label="Sections">
    <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg><span>Home</span></a>
    <a href="#/parameters" data-route="parameters"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18M6 19V9M11 19V5M16 19v-7"/></svg><span>Params</span></a>
    <button class="tabbar__fab" data-action="log-test" aria-label="Log a test">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="#/maintenance" data-route="maintenance">
      <span class="tabbar__slot">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H5a2 2 0 00-2 2v4M15 3h4a2 2 0 012 2v4M9 21H5a2 2 0 01-2-2v-4M15 21h4a2 2 0 002-2v-4"/><path d="M12 8v4l3 2"/></svg>
        <span class="tabbar__dot" id="dueDot" hidden></span>
      </span>
      <span>Care</span>
    </a>
    <button type="button" data-action="open-nav" aria-label="More sections">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span>More</span>
    </button>
  </nav>

</div>

<div id="modalHost" class="modal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal__head">
      <h2 id="modalTitle"></h2>
      <button class="iconbtn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal__body" id="modalBody"></div>
    <footer class="modal__foot" id="modalFoot"></footer>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="updateBar" class="updatebar" role="status" hidden>
  <span>A new version of Reef Log is ready.</span>
  <button type="button" class="btn btn--sm" id="updateReload">Reload</button>
</div>

<script type="module" src="js/app.js"></script>
<script>
  // If ES modules fail to load (e.g. opened via file:// where module CORS is blocked),
  // replace the loading screen with an actionable message instead of a blank page.
  window.setTimeout(function () {
    var app = document.getElementById('app');
    if (app && app.hasAttribute('hidden')) {
      var boot = document.getElementById('boot');
      if (!boot || boot.dataset.failed) return;
      boot.dataset.failed = '1';
      boot.innerHTML =
        '<div class="boot__logo"></div>' +
        '<p class="boot__err"><strong>Reef Log could not start.</strong></p>' +
        '<p class="boot__msg">If you opened this file directly from disk, browsers block it. ' +
        'Run <code>serve.ps1</code> and open <code>http://localhost:8080</code> instead, ' +
        'or use the published GitHub Pages URL.</p>';
    }
  }, 4000);
</script>
</body>
</html>
